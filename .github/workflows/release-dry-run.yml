# M0-020: tag-triggered release dry-run: build, full activated aggregate,
# staged build artifacts, SHA256SUMS and an SPDX 2.3 SBOM. No publishing,
# no GitHub release; uploads only workflow artifacts named release-dry-run-*.
name: m0 / release-dry-run

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ci-release-dry-run-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release-dry-run:
    name: m0 / release-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COREPACK_DEFAULT_TO_LATEST: "0"
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_PROJECT_SPEC: "1"
      COREPACK_ENABLE_STRICT: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute merge base from previous commit
        run: |
          MERGE_BASE="$(git rev-parse HEAD^)"
          echo "DATAPULSE_MERGE_BASE=${MERGE_BASE}" >> "${GITHUB_ENV}"
      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Enable Corepack shims
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install fixed Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Build production bundles
        run: corepack pnpm run build
      - name: Run full activated aggregate (dry run, no publish)
        run: corepack pnpm run verify:pr
      - name: Generate release dry-run artifacts, checksums and SBOM
        run: corepack pnpm run release:dry-run
      - name: Upload release dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.ref_name }}
          path: release/dry-run/
          if-no-files-found: error
